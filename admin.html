<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="css/style.css"><title>Admin | SUNLED</title><meta name="description" content="SUNLED product admin."></head>
<body>
<header id="site-header"></header>
<main>

<section class="banner"><div class="wrap"><h1>Manage products</h1><p class="lead">Changes save in this browser only. There is no login, so keep this page off any public website.</p></div></section>
<section class="section" style="padding-top:24px"><div class="wrap"><form id="pform" class="two"><input type="hidden" name="id"><input type="hidden" name="image"><div>
<label>Name</label><input name="name"><label for="a-cat">Category</label><select name="category" id="a-cat"></select>
<label>Wattage</label><input name="wattage" placeholder="For example 36W"><label>Price in ₹ (optional)</label><input name="price" inputmode="decimal">
<label for="a-file">Photo</label><input id="a-file" type="file" accept="image/*"><img id="preview" class="preview" alt="Photo preview" hidden> <button class="btn btn-line btn-sm" type="button" id="clear-img">Remove photo</button></div><div>
<label>Description</label><textarea name="description" rows="3"></textarea><label>Specifications (one per line, Name: Value)</label><textarea name="specs" rows="4"></textarea>
<p style="margin-top:14px"><label class="inline"><input type="checkbox" name="available" checked>Available</label><label class="inline"><input type="checkbox" name="featured">Show on home page</label></p>
<button class="btn btn-wa" type="submit">Save product</button> <button class="btn btn-line" type="reset">Clear form</button></div></form>
<p id="msg" role="status" style="font-weight:500;color:var(--navy)"></p>
<div class="tablewrap"><table class="admin"><thead><tr><th>Photo</th><th>Name</th><th>Category</th><th>Available</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="row"><button class="btn btn-line btn-sm" id="export" type="button">Download backup</button><label class="btn btn-line btn-sm" style="margin:0">Restore backup<input id="import" type="file" accept="application/json" hidden></label><button class="btn btn-del btn-sm" id="reset" type="button">Reset to sample data</button></div></div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/products.js"></script><script src="js/storage.js"></script><script src="js/main.js"></script><script src="js/admin.js"></script>
</body></html>
